# Goal: whenever someone changes Python code,
# the linter checks syntax, formatting, and indentation.
name: Auto Linter

on:
  push:
    paths:
      - "**/*.py"
  pull_request:
    paths:
      - "**/*.py"

jobs:
  code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout/Clone the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # This step installs the linter tool
      - name: Install Linter
        run: pip install ruff

      # This step runs the linter
      - name: Check syntax and lint errors
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .
     
