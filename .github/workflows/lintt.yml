# Goal: whenever someone changes Python or YAML files,
# the linters check syntax, formatting, and indentation.
name: Auto Linter

on:
  push:
    paths:
      - "**/*.py"
      - "**/*.yml"
      - "**/*.yaml"
  pull_request:
    paths:
      - "**/*.py"
      - "**/*.yml"
      - "**/*.yaml"

jobs:
  python-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout/Clone the code
        uses: actions/checkout@v4

      - name: Install Ruff
        run: pip install ruff

      - name: Check syntax and lint errors
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

  yaml-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout/Clone the code
        uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint YAML files
        run: yamllint .
